<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsub - Choose Provider</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .phone-container {
            width: 390px;
            height: 800px;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 10px #334155;
            display: flex;
            flex-direction: column;
            padding: 40px 20px 24px 20px;
            position: relative;
            overflow: hidden;
        }
        .phone-container::before {
            content: '';
            position: absolute;
            top: 16px;
            width: 120px;
            height: 20px;
            background: #1e293b;
            border-radius: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
        .header { text-align: center; margin-top: 16px; margin-bottom: 12px; }
        .soap-icon { font-size: 36px; margin-bottom: 4px; }
        h1 { font-size: 22px; color: #0f172a; font-weight: 800; }
        p.subtitle { font-size: 12px; color: #64748b; margin-top: 4px; margin-bottom: 16px; text-align: center; }
        
        .providers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }
        .provider-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 14px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #0f172a;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .provider-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
        .notice {
            font-size: 11px;
            color: #64748b;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-top: 12px;
            text-align: center;
        }

        /* Modal Overlay for IMAP Login */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            padding: 40px 20px;
            flex-direction: column;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
        }
        .modal-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        .close-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <div class="soap-icon">🧼🫧</div>
            <h1>Unsub</h1>
            <p class="subtitle">Select your email provider to clean your inbox in one tap.</p>
        </div>

        <div class="providers-list">
            <!-- 1. Google OAuth -->
            <a href="/auth/google" class="provider-btn">
                <span>🔴 Google / Gmail</span>
                <span>Sign In →</span>
            </a>

            <!-- 2. Yahoo IMAP -->
            <button class="provider-btn" onclick="openImapModal('Yahoo', 'imap.mail.yahoo.com', 993)">
                <span>🟣 Yahoo Mail</span>
                <span>Connect →</span>
            </button>

            <!-- 3. iCloud IMAP -->
            <button class="provider-btn" onclick="openImapModal('iCloud', 'imap.mail.me.com', 993)">
                <span>☁️ iCloud Mail</span>
                <span>Connect →</span>
            </button>

            
             <a href="/auth/outlook" class="provider-btn">
    <span>🔵 Outlook / Hotmail</span>
    <span>Sign In →</span>
</a>   

            <!-- 5. AOL IMAP -->
            <button class="provider-btn" onclick="openImapModal('AOL', 'imap.aol.com', 993)">
                <span>🟡 AOL Mail</span>
                <span>Connect →</span>
            </button>

            <!-- 6. Custom IMAP -->
            <button class="provider-btn" onclick="openImapModal('Custom IMAP', '', 993)">
                <span>⚙️ Other / Custom IMAP</span>
                <span>Setup →</span>
            </button>
        </div>

        <div class="notice">
            ✨ One-click clean: Automatically scans promotional mail. (Allow 24-48 hrs for sender removal).
        </div>

        <!-- IMAP Login Modal -->
        <div id="imap-modal" class="modal">
            <div class="modal-content">
                <h3 id="modal-title" style="font-size: 16px; font-weight: 800;">Connect Account</h3>
                <input type="email" id="imap-email" placeholder="Your Email Address">
                <input type="password" id="imap-password" placeholder="Password / App Password">
                <input type="text" id="imap-host" placeholder="IMAP Host (e.g. imap.mail.yahoo.com)">
                <input type="number" id="imap-port" value="993" placeholder="Port">
                <button class="modal-btn" onclick="submitImapLogin()">Connect & Scan Inbox</button>
                <button class="close-btn" onclick="closeImapModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function openImapModal(provider, host, port) {
            document.getElementById('modal-title').innerText = `Connect ${provider}`;
            document.getElementById('imap-host').value = host;
            document.getElementById('imap-port').value = port;
            document.getElementById('imap-modal').style.display = 'flex';
        }

        function closeImapModal() {
            document.getElementById('imap-modal').style.display = 'none';
        }

        function submitImapLogin() {
            const email = document.getElementById('imap-email').value;
            const password = document.getElementById('imap-password').value;
            const host = document.getElementById('imap-host').value;
            const port = document.getElementById('imap-port').value;

            if (!email || !password || !host) {
                alert('Please fill in all email settings fields.');
                return;
            }

            fetch('/api/connect-imap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, host, port })
            })
            .then(res => res.json())
            .then(data => {
                if (data.sessionId) {
                    window.location.href = `/workspace.html?session=${data.sessionId}`;
                } else {
                    alert('Connection failed: ' + (data.message || 'Check credentials'));
                }
            })
            .catch(err => alert('Network error: ' + err.message));
        }
    </script>

</body>
</html>
