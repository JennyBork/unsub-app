<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsub - Take Back Your Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    
    <!-- Mobile Phone Frame Container -->
    <div class="w-full max-w-sm bg-white rounded-[40px] shadow-2xl border-8 border-gray-800 overflow-hidden flex flex-col h-[780px] relative">
        
        <!-- Phone Notch / Header bar -->
        <div class="bg-gray-900 text-white px-6 py-6 flex justify-between items-center shrink-0">
            <h1 class="text-xl font-bold tracking-tight">Unsub 🧼</h1>
            <span class="text-xs bg-indigo-600 text-white px-2.5 py-1 rounded-full font-medium">v1.0</span>
        </div>

        <!-- App Body / Content -->
        <div class="flex-1 overflow-y-auto p-6 bg-gray-50 flex flex-col justify-between">
            
            <div class="space-y-6 text-center mt-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">Clean Your Inbox</h2>
                    <p class="text-sm text-gray-500">Instantly detect promotional senders and zap unwanted subscriptions with one tap.</p>
                </div>

                <div class="py-6 px-4 bg-indigo-50 rounded-2xl border border-indigo-100">
                    <p class="text-xs font-semibold text-indigo-700 uppercase tracking-wider mb-1">Secure Connection</p>
                    <p class="text-xs text-indigo-900">Supports Outlook, Gmail, and IMAP with zero password storage.</p>
                </div>
            </div>

            <!-- Authentication Actions -->
            <div class="space-y-3 mb-6">
                <a href="/auth/outlook" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow transition flex items-center justify-center space-x-2 text-sm">
                    <span>Sign in with Outlook / Azure</span>
                </a>
                <a href="/auth/google" class="w-full bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-medium py-3 px-4 rounded-xl shadow-sm transition flex items-center justify-center space-x-2 text-sm">
                    <span>Sign in with Google</span>
                </a>
            </div>

        </div>

        <!-- Phone Home Indicator Bar -->
        <div class="bg-white py-2 flex justify-center shrink-0 border-t border-gray-100">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>

</body>
</html>
