<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsub - Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Unsub Workspace</h1>
            <button onclick="location.href='/'" class="text-sm text-red-600 hover:underline">Log Out</button>
        </header>

        <div id="loading" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
            <p class="text-gray-600">Scanning your inbox for promotional senders...</p>
        </div>

        <div id="content" class="hidden">
            <div class="bg-white rounded-xl shadow p-6 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Detected Subscriptions</h2>
                    <button id="zapBtn" onclick="zapSelected()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-700 transition">
                        Zap Selected
                    </button>
                </div>
                <div id="subList" class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const session = urlParams.get('session');

        async function loadSubscriptions() {
            try {
                const res = await fetch(`/api/scan?session=${session}`);
                const data = await res.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                const listEl = document.getElementById('subList');
                if (!data.subscriptions || data.subscriptions.length === 0) {
                    listEl.innerHTML = '<p class="text-gray-500 py-4 text-center">No promotional senders found in the recent scan range.</p>';
                    return;
                }

                listEl.innerHTML = data.subscriptions.map((sub, i) => `
                    <div class="py-3 flex items-center justify-between px-2 hover:bg-gray-50 rounded">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" value="${sub.email}" class="sub-checkbox h-4 w-4 text-indigo-600 rounded">
                            <div>
                                <p class="font-medium text-gray-800">${sub.name}</p>
                                <p class="text-sm text-gray-500">${sub.email}</p>
                            </div>
                        </label>
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">${sub.count} emails</span>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Failed to load subscriptions. Please refresh.</p>';
            }
        }

        async function zapSelected() {
            const checkedBoxes = document.querySelectorAll('.sub-checkbox:checked');
            const senders = Array.from(checkedBoxes).map(cb => cb.value);

            if (senders.length === 0) {
                alert('Please select at least one sender to zap.');
                return;
            }

            if (!confirm(`Are you sure you want to zap ${senders.length} sender(s)?`)) return;

            const btn = document.getElementById('zapBtn');
            btn.textContent = 'Zapping...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/zap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-user-session': session },
                    body: JSON.stringify({ senders })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Successfully zapped selected senders!');
                    loadSubscriptions();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Network error while zapping.');
            } finally {
                btn.textContent = 'Zap Selected';
                btn.disabled = false;
            }
        }

        loadSubscriptions();
    </script>
</body>
</html>
